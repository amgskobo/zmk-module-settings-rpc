name: Test ZMK Module

on:
  push:
    branches: ["main", "codex/settings-rpc-review"]
    paths-ignore:
      - "web/**"
      - "tests/web/**"
      - "tests/run-web.sh"
      - ".github/workflows/web-ui.yml"
  pull_request:
    paths-ignore:
      - "web/**"
      - "tests/web/**"
      - "tests/run-web.sh"
      - ".github/workflows/web-ui.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-west-modules
        with:
          path: dependencies/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{hashFiles('west/**/west*.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
      - name: Init
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          west init -l west --mf west-test-standalone.yml
          west update --narrow
          west zephyr-export
      - name: Test activity RPC wire contract
        run: bash tests/run-host-docker.sh
      - name: Test report sender work budget
        run: SETTINGS_REPORT_ARTIFACTS="$PWD/report-sender-output" python3 tests/report-sender/run.py
      - name: Test
        run: OWNER_TEST_OUTPUT="$PWD/owner-test-output" python3 -m unittest discover -v -s tests -p test_owner.py
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          include-hidden-files: true
          path: |
            owner-test-output/**/*.uf2
            owner-test-output/**/*.elf
            !owner-test-output/**/zephyr_pre*.elf
            owner-test-output/**/*.exe
            owner-test-output/**/*.log
            owner-test-output/**/*.diff
            owner-test-output/**/*.json
            owner-test-output/**/*.dts
            owner-test-output/**/.config
            owner-test-output/**/CMakeCache.txt
            owner-test-output/**/zephyr_modules.txt
            report-sender-output/**/*.log
            report-sender-output/**/*.json
            report-sender-output/**/*.elf
            report-sender-output/**/*.exe
            report-sender-output/**/.config
            report-sender-output/**/CMakeCache.txt
